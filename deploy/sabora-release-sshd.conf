# Dedicated Sabora sshd instance only. Template: NOT a shared sshd_config drop-in.
# Replace LISTEN_ADDRESS, PORT, HOST_KEY and AUTHORIZED_KEYS after approval.
ListenAddress LISTEN_ADDRESS
Port PORT
HostKey HOST_KEY
PidFile /var/lib/sabora-release/controller/sshd.pid
AllowUsers sabora-release
AuthorizedKeysFile AUTHORIZED_KEYS
StrictModes yes
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
UsePAM no
PermitTTY no
DisableForwarding yes
AllowTcpForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
PermitUserRC no
PermitUserEnvironment no
ForceCommand /etc/sabora/release/bin/ssh-entry
MaxSessions 1
MaxAuthTries 2
LoginGraceTime 20
# No Subsystem declaration: SFTP and SCP commands are rejected by parser.
# authorized_keys: restrict,command="/etc/sabora/release/bin/ssh-entry" ssh-ed25519 KEY
# Account shell is compiled sabora-release-shell.c, never /bin/sh or nologin.
