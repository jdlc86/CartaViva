name: Sabora management browser visual smoke
on:
  pull_request:
    paths:
      - '.github/workflows/management-browser-visual-smoke.yml'
      - 'scripts/ci/management-browser-visual-smoke.sh'
      - 'scripts/ci/management-authenticated-browser-smoke.mjs'
      - 'apps/management/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  management-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build management PWA
        run: pnpm --filter @sabora/management build
      - name: Install isolated browser tooling (bounded)
        run: |
          set -euo pipefail
          echo 'Installing Playwright Chromium; installation limited to 180 seconds'
          timeout --signal=TERM --kill-after=15s 180s npm exec --yes --package=playwright@1.56.1 -- playwright install chromium
          echo 'Chromium installed successfully'
      - name: Capture disconnected management pages at responsive breakpoints
        run: bash scripts/ci/management-browser-visual-smoke.sh
      - name: Exercise authenticated management in Chromium (isolated HTTP fixture)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          pnpm --filter @sabora/management exec vite --host 127.0.0.1 --port 4179 --strictPort >"$tmp/vite.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -rf "$tmp"' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4179/; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then cat "$tmp/vite.log"; exit 1; fi
          npm install --prefix "$tmp" --no-save --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.56.1
          SABORA_CI_MANAGEMENT_URL=http://127.0.0.1:4179 \
          SABORA_CI_PLAYWRIGHT_MODULE="$tmp/node_modules/playwright/index.mjs" \
            timeout --signal=TERM --kill-after=10s 90s node scripts/ci/management-authenticated-browser-smoke.mjs
      - name: Publish visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sabora-management-visual-smoke
          path: /tmp/sabora-management-visual-smoke/
          if-no-files-found: warn
          retention-days: 7
