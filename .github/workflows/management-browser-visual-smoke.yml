name: Sabora management browser visual smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  management-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build management PWA
        run: pnpm --filter @sabora/management build
      - name: Install isolated browser tooling
        run: |
          npm exec --yes --package=playwright@1.56.1 -- playwright install --with-deps chromium
      - name: Capture disconnected management pages at responsive breakpoints
        run: bash scripts/ci/management-browser-visual-smoke.sh
      - name: Publish visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sabora-management-visual-smoke
          path: /tmp/sabora-management-visual-smoke/
          if-no-files-found: warn
          retention-days: 7
