name: Sabora governed release V2 (manual only)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan, deploy or application-only rollback of exactly one Sabora release
        type: choice
        required: true
        options: [plan, deploy, rollback]
      release_sha:
        description: Exact 40-character merged Git commit SHA
        required: true
        type: string
      source_issue_number:
        description: Optional originating owner Issue (set only by protected Issue bridge)
        required: false
        type: string
permissions:
  contents: read
  actions: read
  checks: read
  issues: read
concurrency:
  group: sabora-exclusive-vps-release
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'jdlc86/CartaViva' && github.ref == 'refs/heads/main' &&
      (github.triggering_actor == 'jdlc86' ||
       (github.run_attempt == '1' && github.triggering_actor == 'github-actions[bot]')) &&
      (github.actor == 'jdlc86' ||
       (github.actor == 'github-actions[bot]' && inputs.source_issue_number != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      approved_sha: ${{ steps.scope.outputs.sha }}
      source_issue_number: ${{ steps.owner.outputs.source_issue_number }}
      owner_verified: ${{ steps.owner.outputs.owner_verified }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate manual owner or exact originating owner Issue
        id: owner
        env:
          SOURCE_ISSUE_NUMBER: ${{ inputs.source_issue_number }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner='jdlc86';
            const source=process.env.SOURCE_ISSUE_NUMBER;
            if(context.actor==='jdlc86'){
              if(source)throw Error('manual_dispatch_cannot_claim_issue');
              core.setOutput('source_issue_number','');
            }else{
              if(context.actor!=='github-actions[bot]' || !/^[1-9][0-9]{0,11}$/.test(source))
                throw Error('untrusted_dispatch_actor');
              const {verifyLiveGovernedReleaseIssue}=await import(
                process.env.GITHUB_WORKSPACE + '/scripts/ci/sabora-owner-issue-dispatch.mjs');
              await verifyLiveGovernedReleaseIssue({github,source,
                operation:process.env.RELEASE_OPERATION,sha:process.env.RELEASE_SHA});
              core.setOutput('source_issue_number',source);
            }
            core.setOutput('owner_verified',owner);
      - name: Validate exact SHA and ancestry in main
        id: scope
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          if [[ "$RELEASE_OPERATION" == deploy ]]; then
            test "$RELEASE_SHA" = "$GITHUB_SHA"
          fi
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify immutable release plan and integrated CI
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_SHA: ${{ steps.scope.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/sabora-release-governor.mjs plan "$RELEASE_OPERATION" "$RELEASE_SHA"
          node scripts/ci/sabora-release-governor.mjs check-ci "$RELEASE_OPERATION" "$RELEASE_SHA"
          # "plan" is read-only; unprotected main may be inspected but must
          # never authorize a release/rollback without a protected branch.
          if [[ "$RELEASE_OPERATION" != plan ]]; then
            node scripts/ci/sabora-release-governor.mjs check-main "$RELEASE_OPERATION" "$RELEASE_SHA"
          fi
  execute:
    # A job-only rerun can reuse verify's outputs from an earlier attempt.
    if: >-
      github.repository == 'jdlc86/CartaViva' && github.ref == 'refs/heads/main' &&
      (github.triggering_actor == 'jdlc86' ||
       (github.run_attempt == '1' && github.triggering_actor == 'github-actions[bot]')) &&
      (inputs.operation == 'deploy' || inputs.operation == 'rollback')
    needs: verify
    environment: sabora-live
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revalidate owner Issue after the Sabora Environment
        if: needs.verify.outputs.source_issue_number != ''
        env:
          SOURCE_ISSUE_NUMBER: ${{ needs.verify.outputs.source_issue_number }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_SHA: ${{ needs.verify.outputs.approved_sha }}
        uses: actions/github-script@v7
        with:
          script: |
            const {verifyLiveGovernedReleaseIssue}=await import(
              process.env.GITHUB_WORKSPACE + '/scripts/ci/sabora-owner-issue-dispatch.mjs');
            await verifyLiveGovernedReleaseIssue({github,source:process.env.SOURCE_ISSUE_NUMBER,
              operation:process.env.RELEASE_OPERATION,sha:process.env.RELEASE_SHA});
      - name: Find exact main-push release package (read-only GitHub API)
        if: inputs.operation == 'deploy'
        id: artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify.outputs.approved_sha }}
        run: node scripts/ci/sabora-release-artifact.mjs "$RELEASE_SHA"
      - uses: actions/download-artifact@v4
        if: inputs.operation == 'deploy'
        with:
          name: sabora-governed-release-package
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/sabora-release-package
      - name: Bind owner GitHub run, immutable SHA and package (no external signer)
        id: consent
        env:
          SABORA_RELEASE_AGENT_READY: ${{ vars.SABORA_RELEASE_AGENT_READY }}
          SABORA_OWNER_VERIFIED: ${{ needs.verify.outputs.owner_verified }}
          SABORA_SOURCE_ISSUE_NUMBER: ${{ needs.verify.outputs.source_issue_number }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_SHA: ${{ needs.verify.outputs.approved_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SABORA_OWNER_VERIFIED" = jdlc86
          test "$GITHUB_REPOSITORY" = jdlc86/CartaViva
          test "$GITHUB_REF" = refs/heads/main
          test "$SABORA_RELEASE_AGENT_READY" = explicitly-provisioned-v2
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          node scripts/ci/sabora-release-governor.mjs check-ci "$RELEASE_OPERATION" "$RELEASE_SHA"
          # Environment access alone is not sufficient while main is unprotected.
          # Recheck AFTER approval, just before minting the unsigned V2 receipt.
          node scripts/ci/sabora-release-governor.mjs check-main "$RELEASE_OPERATION" "$RELEASE_SHA"
          if [[ "$RELEASE_OPERATION" == deploy ]]; then
            node scripts/ci/sabora-release-authorization-v2.mjs create "$RUNNER_TEMP/sabora-release-package/manifest.json"
          else
            node scripts/ci/sabora-release-authorization-v2.mjs create none
          fi
      - name: Use dedicated, pinned SSH forced command; never invoke Docker directly
        env:
          SABORA_SSH_KEY_B64: ${{ secrets.SABORA_SSH_KEY_B64 }}
          SABORA_SSH_KNOWN_HOSTS_B64: ${{ secrets.SABORA_SSH_KNOWN_HOSTS_B64 }}
          RELEASE_SHA: ${{ needs.verify.outputs.approved_sha }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          AUTHORIZATION_ID: ${{ steps.consent.outputs.authorization_id }}
          AUTHORIZATION_HASH: ${{ steps.consent.outputs.authorization_sha256 }}
          SABORA_RELEASE_AUTHORIZATION_B64: ${{ steps.consent.outputs.approval_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$SABORA_SSH_KEY_B64" && -n "$SABORA_SSH_KNOWN_HOSTS_B64" && -n "$SABORA_RELEASE_AUTHORIZATION_B64" ]]
          key="$RUNNER_TEMP/sabora-ssh-key"
          known="$RUNNER_TEMP/sabora-known-hosts"
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s' "$SABORA_SSH_KEY_B64" | base64 --decode > "$key"
          printf '%s' "$SABORA_SSH_KNOWN_HOSTS_B64" | base64 --decode > "$known"
          chmod 600 "$key" "$known"
          ssh-keygen -y -P '' -f "$key" > /dev/null
          ssh-keygen -F 146.59.145.64 -f "$known" > /dev/null
          # Server side must use one Sabora-only forced command. No generic
          # SSH shell, global sudo, SCP, SFTP, networking or Docker admin.
          {
            if [[ "$RELEASE_OPERATION" == deploy ]]; then
              node scripts/ci/sabora-release-transport.mjs "$RUNNER_TEMP/sabora-release-package"
            else
              node scripts/ci/sabora-release-rollback-request.mjs
            fi
          } | ssh -F /dev/null -T -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
              -i "$key" -p 22 sabora-release@146.59.145.64 \
              "sabora-release-v2 $RELEASE_OPERATION $RELEASE_SHA $AUTHORIZATION_ID $AUTHORIZATION_HASH $GITHUB_RUN_ID"
