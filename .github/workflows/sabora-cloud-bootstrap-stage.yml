name: Sabora cloud SSH bootstrap staging (candidate, no installation)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Prepare locally or stage exact inactive launchers via restricted SSH
        required: true
        options: [plan, stage]
      reviewed_main_sha:
        description: Exact approved 40-hex SHA of main for this one-time operation
        required: true
        type: string
  workflow_call:
    inputs:
      operation:
        description: Closed one-time operation, checked inside the workflow
        required: true
        type: string
      reviewed_main_sha:
        description: Exact currently approved SHA of main
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: sabora-one-time-bootstrap
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'jdlc86/CartaViva' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'jdlc86' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issues' &&
          github.event.action == 'opened' &&
          github.event.issue.user.login == 'jdlc86' &&
          github.event.issue.title == format('[sabora] bootstrap stage {0}', inputs.reviewed_main_sha) &&
          (github.event.issue.body == '' || github.event.issue.body == null)
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require current main, unchanged SHA, and exact successful integrated CI
        env:
          BOOTSTRAP_OPERATION: ${{ inputs.operation }}
          REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "${BOOTSTRAP_OPERATION}" in plan|stage) ;; *) exit 1 ;; esac
          [[ "$REVIEWED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$REVIEWED_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          node scripts/ci/sabora-release-governor.mjs check-ci plan "$GITHUB_SHA"
          node scripts/ci/sabora-cloud-bootstrap-verify.mjs workflow
      - name: Retrieve only pinned historic launcher artifact from GitHub Actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location --retry 0 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o "$RUNNER_TEMP/sabora-ci-launchers.zip" \
            https://api.github.com/repos/jdlc86/CartaViva/actions/artifacts/14662749824/zip
          node scripts/ci/sabora-cloud-bootstrap-verify.mjs archive "$RUNNER_TEMP/sabora-ci-launchers.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sabora-bootstrap-source-verified
          path: ${{ runner.temp }}/sabora-ci-launchers.zip
          if-no-files-found: error
          retention-days: 1
  stage:
    if: inputs.operation == 'stage'
    needs: verify
    environment: sabora-bootstrap-stage
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: sabora-bootstrap-source-verified
          path: ${{ runner.temp }}/sabora-incoming
      - name: Verify exact SHA and PIN, then transfer inactive ZIP only
        env:
          REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          SABORA_BOOTSTRAP_SSH_KEY_B64: ${{ secrets.SABORA_BOOTSTRAP_SSH_KEY_B64 }}
          SABORA_BOOTSTRAP_KNOWN_HOSTS_B64: ${{ secrets.SABORA_BOOTSTRAP_KNOWN_HOSTS_B64 }}
          SABORA_BOOTSTRAP_HOST_ED25519_FINGERPRINT: ${{ vars.SABORA_BOOTSTRAP_HOST_ED25519_FINGERPRINT }}
          SABORA_BOOTSTRAP_CLIENT_ED25519_FINGERPRINT: ${{ vars.SABORA_BOOTSTRAP_CLIENT_ED25519_FINGERPRINT }}
        shell: bash
        run: bash scripts/ci/sabora-bootstrap-stage-transport.sh
