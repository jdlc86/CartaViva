name: Sabora cloud SSH bootstrap staging (candidate, no installation)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Prepare locally or stage exact inactive launchers via restricted SSH
        required: true
        options: [plan, stage]
      reviewed_main_sha:
        description: Exact approved 40-hex SHA of main for this one-time operation
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: sabora-one-time-bootstrap
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'jdlc86/CartaViva' && github.ref == 'refs/heads/main' && github.actor == 'jdlc86'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require current main, unchanged SHA, and exact successful integrated CI
        env:
          REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$REVIEWED_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          node scripts/ci/sabora-release-governor.mjs check-ci plan "$GITHUB_SHA"
          node scripts/ci/sabora-cloud-bootstrap-verify.mjs workflow
      - name: Retrieve only pinned historic launcher artifact from GitHub Actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location --retry 0 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o "$RUNNER_TEMP/sabora-ci-launchers.zip" \
            https://api.github.com/repos/jdlc86/CartaViva/actions/artifacts/14662749824/zip
          node scripts/ci/sabora-cloud-bootstrap-verify.mjs archive "$RUNNER_TEMP/sabora-ci-launchers.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sabora-bootstrap-source-verified
          path: ${{ runner.temp }}/sabora-ci-launchers.zip
          if-no-files-found: error
          retention-days: 1
  stage:
    if: inputs.operation == 'stage'
    needs: verify
    environment: sabora-bootstrap-stage
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: sabora-bootstrap-source-verified
          path: ${{ runner.temp }}/sabora-incoming
      - name: Recheck main did not change while waiting for separate environment approval
        env:
          REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$REVIEWED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          node scripts/ci/sabora-release-governor.mjs check-ci plan "$GITHUB_SHA"
      - name: Fail closed unless one-time Sabora key, independent host pin and immutable bytes are present
        env:
          SABORA_BOOTSTRAP_SSH_KEY_B64: ${{ secrets.SABORA_BOOTSTRAP_SSH_KEY_B64 }}
          SABORA_BOOTSTRAP_KNOWN_HOSTS_B64: ${{ secrets.SABORA_BOOTSTRAP_KNOWN_HOSTS_B64 }}
          SABORA_BOOTSTRAP_HOST_ED25519_FINGERPRINT: ${{ vars.SABORA_BOOTSTRAP_HOST_ED25519_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$SABORA_BOOTSTRAP_SSH_KEY_B64" && -n "$SABORA_BOOTSTRAP_KNOWN_HOSTS_B64" ]]
          file="$RUNNER_TEMP/sabora-incoming/sabora-ci-launchers.zip"
          node scripts/ci/sabora-cloud-bootstrap-verify.mjs archive "$file"
          key="$RUNNER_TEMP/sabora-bootstrap-key"
          known="$RUNNER_TEMP/sabora-bootstrap-known-hosts"
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s' "$SABORA_BOOTSTRAP_SSH_KEY_B64" | base64 --decode > "$key"
          printf '%s' "$SABORA_BOOTSTRAP_KNOWN_HOSTS_B64" | base64 --decode > "$known"
          chmod 600 "$key" "$known"
          ssh-keygen -y -f "$key" > /dev/null
          ssh-keygen -F 146.59.145.64 -f "$known" > /dev/null
          test "$(wc -l < "$known")" -eq 1
          test "$(awk '{print $1" "$2}' "$known")" = '146.59.145.64 ssh-ed25519'
          [[ "$SABORA_BOOTSTRAP_HOST_ED25519_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')" = "$SABORA_BOOTSTRAP_HOST_ED25519_FINGERPRINT"
          # The host MUST force a preinstalled Sabora-only receiver. No shell,
          # privileged command, SSH agent, SFTP, SCP, or runtime deployment.
          receipt="$(cat "$file" | ssh -F /dev/null -T \
            -o BatchMode=yes -o NumberOfPasswordPrompts=0 \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o IdentitiesOnly=yes -o IdentityAgent=none -o ForwardAgent=no \
            -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile="$known" -o ConnectTimeout=10 \
            -i "$key" -p 22 sabora-bootstrap@146.59.145.64 \
            'sabora-bootstrap-stage-v1 426960f0c6e645cd21575e0883e8a03638cc9e3a')"
          test "$receipt" = 'SABORA_BOOTSTRAP_STAGED:a94c3d09ca371fe2cf021c9fe38bf4694e0c85af9b3c01092eddc6abda6faf5c'
          echo 'SABORA_STAGE_ONLY_CONFIRMED: remote quarantine archive; no installation or deployment'
