name: Sabora S46 preflight plan only (no DB credentials)
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character SHA of current main
        required: true
        type: string
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: sabora-s46-dba-readonly
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'jdlc86/CartaViva' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove exact main and inventory of reviewed migrations
        env:
          SABORA_S46_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          node scripts/ci/sabora-s46-dba-readonly.mjs plan
      - name: Verify five exact-main integrated CI controls
        uses: actions/github-script@v7
        with:
          script: |
            const sha=context.sha, requested='${{ inputs.release_sha }}';
            if(sha!==requested || context.ref!=='refs/heads/main')
              throw Error('sabora_s46_stop:wrong_sha');
            const {data}=await github.rest.checks.listForRef({
              owner:context.repo.owner,repo:context.repo.repo,ref:sha,per_page:100
            });
            if(data.total_count>100) throw Error('sabora_s46_stop:check_inventory_truncated');
            const required=['validate','web-publication','generate-lockfile',
              'functional-ui-gate','windows-offline-signer'];
            for(const name of required){
              const found=data.check_runs.filter(c=>c.name===name);
              if(!found.length || found.some(c=>c.head_sha!==sha ||
                  c.status!=='completed' || c.conclusion!=='success' ||
                  c.app?.slug!=='github-actions'))
                throw Error('sabora_s46_stop:ci_not_success:'+name);
            }
            core.info('sabora_s46_verified_five_exact_main_checks');
