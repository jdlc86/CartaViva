name: Sabora owner Issue -> governed release request (Fleetia-style bridge)
on:
  issues:
    types: [opened]

# This workflow can REQUEST a protected workflow, not authorize any deploy.
# No SSH credentials, controller installation, VPS, SQL, Docker or Fleetia.
permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: sabora-owner-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'jdlc86/CartaViva' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, '[sabora] release ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only main's trusted code; never checkout issue-supplied SHA, PR or fork.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate closed owner Issue and request existing governed workflow
        uses: actions/github-script@v7
        with:
          script: |
            const {dispatchSaboraOwnerReleaseIssue} = await import(
              process.env.GITHUB_WORKSPACE + '/scripts/ci/sabora-owner-issue-dispatch.mjs'
            );
            await dispatchSaboraOwnerReleaseIssue({
              event: context.payload,
              context: {
                repository: context.repo.owner + '/' + context.repo.repo,
                actor: context.actor
              },
              github
            });

  # A separate owner-only command for the ONE-TIME inactive ZIP quarantine.
  # This never routes to the release deploy/rollback dispatcher.
  bootstrap_issue_check:
    if: >-
      github.repository == 'jdlc86/CartaViva' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, '[sabora] bootstrap stage ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      stage_sha: ${{ steps.admission.outputs.stage_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: admission
        name: Revalidate live owner Issue and exact current main; close one-time request
        uses: actions/github-script@v7
        with:
          script: |
            const {acceptSaboraOwnerBootstrapStageIssue} = await import(
              process.env.GITHUB_WORKSPACE + '/scripts/ci/sabora-owner-bootstrap-stage-issue.mjs'
            );
            const receipt = await acceptSaboraOwnerBootstrapStageIssue({
              event: context.payload,
              context: {
                repository: context.repo.owner + '/' + context.repo.repo,
                actor: context.actor
              },
              github
            });
            core.setOutput('stage_sha', receipt.reviewedMainSha);

  # Reuse only the existing archive/CI verifier, in plan mode: NO SSH.
  bootstrap_verify:
    needs: bootstrap_issue_check
    if: >-
      needs.bootstrap_issue_check.result == 'success' &&
      needs.bootstrap_issue_check.outputs.stage_sha != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/sabora-cloud-bootstrap-stage.yml
    with:
      operation: plan
      reviewed_main_sha: ${{ needs.bootstrap_issue_check.outputs.stage_sha }}

  # Normal environment-bound job: two scoped Sabora secrets become available
  # here, not through workflow_call, with no secrets:inherit.
  bootstrap_stage:
    needs: [bootstrap_issue_check, bootstrap_verify]
    if: >-
      github.repository == 'jdlc86/CartaViva' &&
      github.actor == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == format('[sabora] bootstrap stage {0}', needs.bootstrap_issue_check.outputs.stage_sha) &&
      needs.bootstrap_issue_check.result == 'success' &&
      needs.bootstrap_verify.result == 'success' &&
      needs.bootstrap_issue_check.outputs.stage_sha != ''
    permissions:
      contents: read
      actions: read
    concurrency:
      group: sabora-one-time-bootstrap
      cancel-in-progress: false
    environment: sabora-bootstrap-stage
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: sabora-bootstrap-source-verified
          path: ${{ runner.temp }}/sabora-incoming
      - name: Verify exact SHA and PIN, then transfer inactive ZIP only
        env:
          REVIEWED_MAIN_SHA: ${{ needs.bootstrap_issue_check.outputs.stage_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          SABORA_BOOTSTRAP_SSH_KEY_B64: ${{ secrets.SABORA_BOOTSTRAP_SSH_KEY_B64 }}
          SABORA_BOOTSTRAP_KNOWN_HOSTS_B64: ${{ secrets.SABORA_BOOTSTRAP_KNOWN_HOSTS_B64 }}
          SABORA_BOOTSTRAP_HOST_ED25519_FINGERPRINT: ${{ vars.SABORA_BOOTSTRAP_HOST_ED25519_FINGERPRINT }}
          SABORA_BOOTSTRAP_CLIENT_ED25519_FINGERPRINT: ${{ vars.SABORA_BOOTSTRAP_CLIENT_ED25519_FINGERPRINT }}
        shell: bash
        run: bash scripts/ci/sabora-bootstrap-stage-transport.sh
