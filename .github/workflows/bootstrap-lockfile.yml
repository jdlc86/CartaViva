name: Bootstrap Sabora lockfile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'apps/**/package.json'
      - '.github/workflows/bootstrap-lockfile.yml'
      - 'tests/bootstrap-lockfile.test.mjs'

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Sabora
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack and pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --version
      - name: Generate lockfile from package manifests
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Verify lockfile is usable
        run: |
          test -s pnpm-lock.yaml
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Commit verified lockfile to same-repository branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          pnpm install --lockfile-only --ignore-scripts --frozen-lockfile
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'chore(sabora): commit verified pnpm lockfile'
            git push origin "HEAD:$HEAD_REF"
          fi
      - name: Upload generated lockfile
        if: ${{ always() && hashFiles('pnpm-lock.yaml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sabora-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7
