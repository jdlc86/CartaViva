<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sabora · referencia cliente premium V2</title>
<style>
:root{--canvas:#F8F7F4;--surface:#FFFFFF;--ink:#202622;--muted:#606A63;--brand:#146B57;--accent:#D98B45;--border:#DDE2DC;--focus:#155EEF}
*{box-sizing:border-box}body{margin:0;background:#E6EAE6;font:16px system-ui;color:var(--ink)}.app{max-width:440px;margin:auto;background:var(--canvas);min-height:100vh}.top,.bottom{display:flex;justify-content:space-between;align-items:center;background:var(--surface);padding:12px;gap:6px}.logo{width:130px;height:55px}.main{padding:16px 16px 110px}.hero{background:#194B3D;color:white;border-radius:24px;padding:25px;margin-bottom:28px}.hero h1,h2{font:normal 30px Georgia,serif}.hero p{color:#D9E7DF}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.12em;font-weight:bold}.tabs{display:flex;overflow:auto;gap:8px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid var(--border);border-radius:16px;overflow:hidden}.photo{height:128px;background:linear-gradient(145deg,#D7E3D5,#EDE5D8);display:grid;place-items:center;color:#5F7667;font:italic 16px Georgia,serif}.body{padding:12px}.body h3{font-size:16px;margin:8px 0}.body p{font-size:12px;color:var(--muted)}.price{color:var(--brand);font-weight:700;margin:10px 0}button{font:inherit;cursor:pointer;border:1px solid var(--border);background:white;border-radius:12px;min-height:44px;padding:8px}button:focus-visible{outline:3px solid var(--focus)}button.primary,button[aria-pressed=true]{background:var(--brand);color:white}.body button{width:100%;margin-top:6px;font-size:13px}.qty{display:flex;align-items:center;justify-content:space-between}.qty button{width:44px}.bottom{position:sticky;bottom:0}.bottom button{border:0;font-size:11px;padding:4px}.bottom .qr{background:var(--brand);color:white}.cart{position:sticky;bottom:67px;background:#E4F2EC;padding:10px;display:flex;justify-content:space-between}.hidden{display:none}.notice{color:var(--muted);font-size:12px}input{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px}@media(prefers-reduced-motion:no-preference){button{transition:background .18s ease}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="app"><header class="top"><img class="logo" alt="Sabora" src="../brand/sabora-logo-outline-v3.svg"><div><button id="searchBtn" aria-label="Buscar">⌕</button><button id="bell" aria-label="Notificaciones">♧</button><button id="bag" aria-label="Cesta">▢ <span id="badge">0</span></button></div></header><main class="main"><input id="search" class="hidden" placeholder="Buscar platos" aria-label="Buscar platos"><section class="hero" id="hero"><span class="eyebrow">LA EXPERIENCIA SABORA</span><h1 id="headline">El placer está en cada detalle.</h1><p id="subtitle">Una nueva manera de descubrir nuestra cocina.</p><button id="prev" aria-label="Anuncio anterior">←</button> <button id="next" aria-label="Anuncio siguiente">→</button></section><span class="eyebrow">SELECCIÓN GASTRONÓMICA</span><h2>Nuestra carta</h2><p class="notice">Platos y precios de demostración. Sin API ni fotografías autorizadas.</p><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div></main><div class="cart hidden" id="cart"><span id="cartLabel"></span><button id="cartOpen">Ver selección</button></div><nav class="bottom" aria-label="Navegación cliente"><button data-page="Información">Información</button><button data-page="Alérgenos">Alérgenos</button><button class="qr" data-page="QR">▦ QR</button><button data-page="Favoritos">Favoritos</button><button data-page="Ajustes">Ajustes</button></nav></div>
<script>
/* LAB ONLY: fixture data, no customer authentication, ordering or QR simulation. */
const items=[{id:1,name:'Ensalada fresca',cat:'Entrantes',price:8.5,ok:true},{id:2,name:'Arroz de verduras',cat:'Primeros',price:12.9,ok:true},{id:3,name:'Pollo al horno',cat:'Segundos',price:14.5,ok:true},{id:4,name:'Tarta de queso',cat:'Postres',price:5.5,ok:false}];
const ads=[['El placer está en cada detalle.','Una nueva manera de descubrir nuestra cocina.'],['Sabores para compartir.','Cada visita merece algo especial.']];
let active='Todos',ad=0,counts={},favorites=new Set();const el=id=>document.getElementById(id),eur=n=>n.toLocaleString('es-ES',{style:'currency',currency:'EUR'}),quantity=id=>counts[id]||0;
function render(){el('tabs').replaceChildren();for(const cat of ['Todos',...new Set(items.map(x=>x.cat))]){const b=document.createElement('button');b.textContent=cat;b.setAttribute('aria-pressed',active===cat);b.onclick=()=>{active=cat;render()};el('tabs').append(b)}el('grid').replaceChildren();for(const d of items.filter(x=>(active==='Todos'||x.cat===active)&&(x.name.toLowerCase().includes(el('search').value.toLowerCase())))){const card=document.createElement('article');card.className='card';const image=document.createElement('div');image.className='photo';image.textContent='Imagen pendiente';const body=document.createElement('div');body.className='body';const name=document.createElement('h3');name.textContent=d.name;const price=document.createElement('div');price.className='price';price.textContent=eur(d.price);const detail=document.createElement('button');detail.textContent='Ver detalle';detail.onclick=()=>alert('Detalle ilustrativo: los ingredientes y alérgenos deben venir de datos verificados.');const fav=document.createElement('button');fav.textContent=favorites.has(d.id)?'♥ Favorito':'♡ Favorito';fav.onclick=()=>{favorites.has(d.id)?favorites.delete(d.id):favorites.add(d.id);render()};body.append(name,price,detail,fav);if(!d.ok){const b=document.createElement('button');b.disabled=true;b.textContent='Agotado';body.append(b)}else if(!quantity(d.id)){const b=document.createElement('button');b.className='primary';b.textContent='＋ Añadir';b.onclick=()=>change(d.id,1);body.append(b)}else{const row=document.createElement('div');row.className='qty';for(const [label,delta] of [['−',-1],['+',1]]){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-label',label==='+'?'Añadir unidad':'Quitar unidad');b.onclick=()=>change(d.id,delta);if(delta===-1)row.append(b);else{const number=document.createElement('strong');number.textContent=quantity(d.id);row.append(number,b)}}body.append(row)}card.append(image,body);el('grid').append(card)}const n=Object.values(counts).reduce((a,b)=>a+b,0);el('badge').textContent=n;el('cart').classList.toggle('hidden',n===0);el('cartLabel').textContent=n+' platos · '+eur(items.reduce((s,d)=>s+d.price*quantity(d.id),0))}
function change(id,n){counts[id]=Math.max(0,quantity(id)+n);render()}function showAd(){el('headline').textContent=ads[ad][0];el('subtitle').textContent=ads[ad][1]}el('prev').onclick=()=>{ad=(ad+ads.length-1)%ads.length;showAd()};el('next').onclick=()=>{ad=(ad+1)%ads.length;showAd()};if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{ad=(ad+1)%ads.length;showAd()},6500);
el('searchBtn').onclick=()=>{el('search').classList.toggle('hidden');if(!el('search').classList.contains('hidden'))el('search').focus()};el('search').oninput=render;el('cartOpen').onclick=el('bag').onclick=()=>alert('Selección ilustrativa. Reserva y pedido necesitan backend; PEDIR requiere QR auténtico validado.');el('bell').onclick=()=>alert('Notificaciones: integración pendiente.');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>alert(b.dataset.page+': pantalla no conectada. Cliente nunca accede a cocina.'));render();
</script></html>
