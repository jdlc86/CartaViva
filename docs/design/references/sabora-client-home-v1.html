<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F8F7F4"><title>Sabora · prototipo funcional de inicio</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#202622;background:#e8e7e1;--green:#146B57;--cream:#F8F7F4;--gold:#D98B45}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #D98B45;outline-offset:3px}.app{max-width:520px;margin:auto;min-height:100dvh;background:var(--cream);padding:12px 16px 96px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{width:160px;height:auto}.actions{display:flex;align-items:center;gap:6px}.icon-btn{border:0;background:transparent;border-radius:12px;padding:9px;color:var(--green);font-size:23px}.flag{font-size:24px}.lang{border:1px solid #d7ddd5;background:white;border-radius:12px;padding:8px;color:#202622}.search{display:flex;gap:8px;margin:10px 0}.search input{flex:1;min-width:0;border:1px solid #cbd7ce;border-radius:12px;padding:12px;background:white}.search button{border:0;background:#e7eee8;color:var(--green);border-radius:12px;padding:0 14px}.hidden{display:none!important}h1{font:normal 31px Georgia,serif;color:#173e32;margin:20px 0 5px}.intro{color:#65766B;margin:0 0 20px}.tabs{display:flex;gap:8px;overflow:auto;padding:5px 0 13px;scrollbar-width:thin}.tab{border:1px solid #dbe4dc;background:white;color:#345246;border-radius:24px;padding:9px 14px;white-space:nowrap}.tab[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}section{margin:13px 0 25px}h2{font:normal 25px Georgia,serif;color:#173e32;margin:0 0 12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border-radius:17px;overflow:hidden;box-shadow:0 3px 14px #123b2b12}.photo{aspect-ratio:5/4;display:grid;place-items:center;font-size:52px;background:linear-gradient(135deg,#dce5d8,#f0e4ce)}.card-body{padding:11px}.card h3{font-size:15px;margin:0 0 5px}.desc{color:#65766B;font-size:12px;margin:0 0 10px}.card-foot{display:flex;align-items:center;justify-content:space-between;gap:5px}.price{font-weight:750;color:var(--green)}.add{background:var(--green);color:white;border:0;border-radius:10px;padding:6px 11px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;box-shadow:0 -4px 20px #00000012;padding:10px 6px max(10px,env(safe-area-inset-bottom));z-index:5}.nav{border:0;background:none;color:#425e50;display:grid;gap:3px;justify-items:center;font-size:10px}.nav span:first-child{font-size:24px}.nav.qr span:first-child{background:var(--green);color:white;border-radius:15px;padding:7px 13px;margin-top:-19px;border:4px solid white}.notice{padding:12px;border:1px solid #d8e2d9;border-radius:12px;background:#fff;margin:12px 0;font-size:13px}.notice[role=alert]{border-color:#c18b54}dialog{border:0;border-radius:18px;max-width:min(90vw,430px);padding:24px;box-shadow:0 16px 60px #0004}dialog::backdrop{background:#17291f88}dialog button{background:var(--green);color:white;border:0;padding:10px 16px;border-radius:10px}footer{color:#76827a;text-align:center;font-size:12px;margin:26px 0}@media(prefers-reduced-motion:no-preference){.card,.tab{transition:transform .18s,background .18s}.card:hover{transform:translateY(-2px)}}@media(max-width:350px){.app{padding-inline:10px}.cards{gap:8px}.card-body{padding:8px}}
</style></head><body><main class="app"><header class="top"><img class="logo" src="../brand/sabora-logo-outline-v3.svg" alt="Sabora by Allaiso"><div class="actions"><select id="language" class="lang" aria-label="Idioma"><option value="es">🇪🇸 ES</option><option value="en">🇬🇧 EN</option></select><button id="searchToggle" class="icon-btn" aria-label="Abrir búsqueda" aria-expanded="false">⌕</button><button id="cart" class="icon-btn" aria-label="Cesta">♧</button></div></header><div id="searchBox" class="search hidden"><input id="query" type="search" placeholder="Buscar platos o ingredientes" aria-label="Buscar platos"><button id="closeSearch" aria-label="Cerrar búsqueda">✕</button></div><h1 id="heading">Nuestra carta</h1><p class="intro" id="subtitle">Descubre nuestros sabores</p><nav class="tabs" id="tabs" aria-label="Categorías de platos"></nav><div id="status" class="notice" role="status">Demostración visual con datos ficticios. No se realizan pedidos ni reservas reales.</div><div id="menu"></div><footer>Sabora · by Allaiso</footer></main><nav class="bottom" aria-label="Accesos rápidos"><button class="nav" data-action="info"><span>ⓘ</span>Información</button><button class="nav" data-action="allergens"><span>♧</span>Alérgenos</button><button class="nav qr" data-action="qr"><span>▦</span>QR</button><button class="nav" data-action="favorites"><span>♡</span>Favoritos</button><button class="nav" data-action="settings"><span>⚙</span>Ajustes</button></nav><dialog id="dialog"><h2 id="dialogTitle"></h2><p id="dialogBody"></p><button id="dialogClose">Cerrar</button></dialog>
<script>
'use strict';
const categories=['Todos','Entrantes','Primeros','Segundos','Postres','Bebidas'];
const dishes=[
{id:1,cat:'Entrantes',name:'Ensalada mediterránea',desc:'Tomate, hojas verdes y aceitunas',price:5.50,emoji:'🥗'},
{id:2,cat:'Entrantes',name:'Croquetas caseras',desc:'Crujientes y cremosas',price:4.80,emoji:'🥘'},
{id:3,cat:'Primeros',name:'Crema de verduras',desc:'Preparación del día',price:5.20,emoji:'🍲'},
{id:4,cat:'Primeros',name:'Arroz con verduras',desc:'Con productos de temporada',price:6.10,emoji:'🍚'},
{id:5,cat:'Segundos',name:'Pollo al horno',desc:'Con guarnición',price:8.90,emoji:'🍗'},
{id:6,cat:'Segundos',name:'Pescado a la plancha',desc:'Con verduras',price:9.20,emoji:'🐟'},
{id:7,cat:'Postres',name:'Tarta de queso',desc:'Elaboración casera',price:3.80,emoji:'🍰'},
{id:8,cat:'Postres',name:'Fruta de temporada',desc:'Selección fresca',price:2.50,emoji:'🍎'},
{id:9,cat:'Bebidas',name:'Agua mineral',desc:'Botella individual',price:1.20,emoji:'💧'},
{id:10,cat:'Bebidas',name:'Zumo de naranja',desc:'Servido frío',price:2.20,emoji:'🍊'}];
let selected='Todos';let query='';let language='es';const $=id=>document.getElementById(id);
const labels={es:{heading:'Nuestra carta',subtitle:'Descubre nuestros sabores',categories,empty:'No hay platos para esta búsqueda',detail:'Detalle de demostración',unavailable:'Función visual: pendiente de integración con el backend'},en:{heading:'Our menu',subtitle:'Discover our flavours',categories:['All','Starters','First courses','Mains','Desserts','Drinks'],empty:'No dishes found',detail:'Demo details',unavailable:'Visual prototype: backend integration pending'}};
function showDialog(title,body){$('dialogTitle').textContent=title;$('dialogBody').textContent=body;$('dialog').showModal()}
function render(){const l=labels[language];$('heading').textContent=l.heading;$('subtitle').textContent=l.subtitle;$('tabs').replaceChildren();categories.forEach((c,i)=>{const b=document.createElement('button');b.className='tab';b.textContent=l.categories[i];b.setAttribute('aria-pressed',String(selected===c));b.addEventListener('click',()=>{selected=c;render()});$('tabs').append(b)});$('menu').replaceChildren();let count=0;categories.slice(1).filter(c=>selected==='Todos'||selected===c).forEach(c=>{const filtered=dishes.filter(d=>d.cat===c&&(d.name+' '+d.desc).toLocaleLowerCase('es').includes(query.toLocaleLowerCase('es')));if(!filtered.length)return;count+=filtered.length;const sec=document.createElement('section');const h=document.createElement('h2');h.textContent=l.categories[categories.indexOf(c)];sec.append(h);const grid=document.createElement('div');grid.className='cards';filtered.forEach(d=>{const card=document.createElement('article');card.className='card';const photo=document.createElement('div');photo.className='photo';photo.textContent=d.emoji;photo.setAttribute('aria-label','Imagen ilustrativa, no fotografía real');const body=document.createElement('div');body.className='card-body';const title=document.createElement('h3');title.textContent=d.name;const desc=document.createElement('p');desc.className='desc';desc.textContent=d.desc;const foot=document.createElement('div');foot.className='card-foot';const price=document.createElement('span');price.className='price';price.textContent=new Intl.NumberFormat(language==='es'?'es-ES':'en-GB',{style:'currency',currency:'EUR'}).format(d.price);const add=document.createElement('button');add.className='add';add.textContent='+';add.setAttribute('aria-label','Ver '+d.name);add.addEventListener('click',()=>showDialog(d.name,l.detail+': '+d.desc+'. '+l.unavailable));foot.append(price,add);body.append(title,desc,foot);card.append(photo,body);grid.append(card)});sec.append(grid);$('menu').append(sec)});if(!count){const p=document.createElement('p');p.textContent=l.empty;$('menu').append(p)}}
$('searchToggle').addEventListener('click',()=>{$('searchBox').classList.remove('hidden');$('searchToggle').setAttribute('aria-expanded','true');$('query').focus()});$('closeSearch').addEventListener('click',()=>{$('searchBox').classList.add('hidden');$('searchToggle').setAttribute('aria-expanded','false');$('query').value='';query='';render()});$('query').addEventListener('input',e=>{query=e.target.value;render()});$('language').addEventListener('change',e=>{language=e.target.value;render()});$('cart').addEventListener('click',()=>showDialog('Cesta',labels[language].unavailable));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>showDialog(b.textContent.trim(),labels[language].unavailable)));$('dialogClose').addEventListener('click',()=>$('dialog').close());render();
</script></body></html>
