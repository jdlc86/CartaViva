<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CartaViva · Referencia visual de carta</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#202622;background:#f8f7f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.app{max-width:490px;margin:auto;min-height:100dvh;background:#fff;box-shadow:0 2px 25px #2026220d;padding-bottom:104px}.top{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 12px}.logo{font-weight:750;font-size:25px;letter-spacing:-1px}.logo span{color:#146b57}.sub{font-size:12px;color:#606a63}.icons{display:flex;gap:6px}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #155eef;outline-offset:2px}.icon{border:0;background:transparent;width:44px;height:44px;font-size:22px;border-radius:50%}.search{padding:0 18px 12px}.search[hidden]{display:none}.search input{width:100%;padding:13px;border:1px solid #dde2dc;border-radius:12px;font-size:16px}.hero{margin:0 18px;border-radius:17px;overflow:hidden;min-height:145px;background:linear-gradient(120deg,#174b3d,#9a7951);color:#fff;display:flex;align-items:end;padding:20px}.hero strong{font-size:25px}.section{padding:18px}.section h1{font-size:23px;margin:0 0 4px;letter-spacing:-.5px}.section p{color:#606a63;margin:0 0 18px;font-size:14px}.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px}.tab{white-space:nowrap;border:1px solid #dde2dc;background:#fff;border-radius:999px;padding:9px 14px;font-size:13px}.tab[aria-pressed=true]{background:#146b57;color:white;border-color:#146b57}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.card{border:1px solid #e5e8e4;border-radius:16px;overflow:hidden;background:white}.photo{aspect-ratio:5/4;background:linear-gradient(135deg,#e4f2ec,#e6c5a6);display:grid;place-items:center;font-size:44px}.card-body{padding:12px}.card h2{font-size:15px;margin:0 0 7px;line-height:1.25}.allergen{font-size:12px;color:#606a63;min-height:34px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px}.price{font-weight:700}.add{border:0;background:#146b57;color:#fff;border-radius:10px;min-width:40px;min-height:40px;font-size:22px}.cart{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(490px,100%);background:#f0efeb;border-top:1px solid #dde2dc;padding:13px 18px;display:flex;justify-content:space-between;align-items:center}.cart strong{font-size:21px}.cart button{background:#146b57;color:#fff;border:0;border-radius:12px;padding:14px 17px;font-weight:650}.count{font-size:13px;color:#606a63}.empty{grid-column:1/-1;color:#606a63}@media(max-width:350px){.grid{gap:8px}.card-body{padding:9px}.section{padding:12px}}
</style></head><body><main class="app"><header class="top"><div><div class="logo">CartaViva <span>●</span></div><div class="sub">Tu restaurante, a tu ritmo</div></div><div class="icons"><button class="icon" id="toggleSearch" aria-label="Abrir búsqueda" aria-expanded="false">⌕</button><button class="icon" aria-label="Notificaciones">♧</button><button class="icon" aria-label="Perfil">◯</button></div></header><div class="search" id="searchBox" hidden><input id="query" type="search" placeholder="Buscar platos…" aria-label="Buscar platos"></div><div class="hero"><strong>Una carta para disfrutar</strong></div><section class="section"><h1>¿Qué te apetece hoy?</h1><p>Explora nuestra carta y prepara tu selección.</p><nav class="tabs" aria-label="Categorías" id="tabs"></nav><div class="grid" id="grid"></div></section></main><footer class="cart"><div><div class="count" id="count">0 productos seleccionados</div><strong id="total">0,00 €</strong></div><button id="viewCart">Ver mi cesta →</button></footer><script>
const data=[{id:1,name:"Ensalada mediterránea",category:"Entrantes",price:4.5,allergens:"Leche",emoji:"🥗"},{id:2,name:"Pasta cremosa",category:"Primeros",price:7.9,allergens:"Gluten · Leche",emoji:"🍝"},{id:3,name:"Pollo a la brasa",category:"Segundos",price:9.5,allergens:"Consultar ficha de alérgenos",emoji:"🍗"},{id:4,name:"Tarta de queso",category:"Postres",price:4.2,allergens:"Gluten · Huevo · Leche",emoji:"🍰"},{id:5,name:"Agua mineral",category:"Bebidas",price:1.5,allergens:"Declaración pendiente",emoji:"🥤"}];const categories=["Todos","Entrantes","Primeros","Segundos","Postres","Bebidas"];let selected="Todos",qty={};const fmt=n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(n);const grid=document.querySelector("#grid"),tabs=document.querySelector("#tabs");function render(){tabs.replaceChildren(...categories.map(cat=>{const b=document.createElement("button");b.className="tab";b.textContent=cat;b.setAttribute("aria-pressed",String(cat===selected));b.onclick=()=>{selected=cat;render()};return b}));grid.replaceChildren();const q=document.querySelector("#query").value.trim().toLocaleLowerCase("es");const matches=data.filter(p=>(selected==="Todos"||p.category===selected)&&p.name.toLocaleLowerCase("es").includes(q));for(const p of matches){const el=document.createElement("article");el.className="card";el.innerHTML='<div class="photo" aria-hidden="true">'+p.emoji+'</div><div class="card-body"><h2></h2><div class="allergen"></div><div class="bottom"><span class="price"></span><button class="add" aria-label="Añadir">+</button></div><div class="count"></div></div>';el.querySelector("h2").textContent=p.name;el.querySelector(".allergen").textContent=p.allergens;el.querySelector(".price").textContent=fmt(p.price);el.querySelector(".add").setAttribute("aria-label","Añadir "+p.name);el.querySelector(".add").onclick=()=>{qty[p.id]=(qty[p.id]||0)+1;render()};el.querySelector(".count").textContent=qty[p.id]?qty[p.id]+" en tu cesta":"";grid.append(el)}if(!matches.length){const e=document.createElement("p");e.className="empty";e.textContent="No se encontraron platos.";grid.append(e)}const count=data.reduce((s,p)=>s+(qty[p.id]||0),0),total=data.reduce((s,p)=>s+(qty[p.id]||0)*p.price,0);document.querySelector("#count").textContent=count+" productos seleccionados";document.querySelector("#total").textContent=fmt(total)}document.querySelector("#toggleSearch").onclick=()=>{const box=document.querySelector("#searchBox"),open=box.hidden;box.hidden=!open;document.querySelector("#toggleSearch").setAttribute("aria-expanded",String(open));document.querySelector("#toggleSearch").setAttribute("aria-label",open?"Cerrar búsqueda":"Abrir búsqueda");if(open)document.querySelector("#query").focus();else{document.querySelector("#query").value="";render()}};document.querySelector("#query").oninput=render;document.querySelector("#viewCart").onclick=()=>alert("Prototipo visual: la pantalla de cesta se diseñará por separado.");render();
</script></body></html>
