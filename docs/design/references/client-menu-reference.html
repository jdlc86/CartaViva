<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F8F7F4"><title>CartaViva · Laboratorio de referencia visual</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#202622;background:#f8f7f4;font-synthesis:none;--canvas:#f8f7f4;--brand:#146b57;--ink:#202622;--muted:#606a63;--line:#dde2dc;--speed:170ms}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #155eef;outline-offset:3px}.app{max-width:500px;margin:auto;min-height:100dvh;background:var(--canvas);padding-bottom:112px}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 18px 14px}.logo{font-weight:750;font-size:25px;letter-spacing:-1px}.logo span{color:var(--brand)}.sub,.muted{color:var(--muted)}.sub{font-size:12px}.icons{display:flex;gap:3px}.icon{width:44px;height:44px;border:0;background:#fff;border-radius:50%;font-size:20px}.search{padding:0 18px 12px}.search[hidden],dialog:not([open]){display:none}.search input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:16px}.hero{margin:0 18px;border-radius:20px;min-height:174px;display:flex;align-items:end;padding:22px;color:white;background:radial-gradient(circle at 76% 30%,#dfac6a 0 12%,transparent 13%),radial-gradient(circle at 70% 45%,#91a47a 0 21%,transparent 22%),linear-gradient(125deg,#174b3d,#5d7656 56%,#bd9265)}.hero strong{font-size:27px;max-width:225px;line-height:1.1;text-shadow:0 1px 10px #173d31aa}.section{padding:22px 18px}.section h1{font-size:24px;letter-spacing:-.6px;margin:0 0 5px}.section p{font-size:14px;margin:0 0 18px}.tabs{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding:0 0 8px}.tab,.diet{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:10px 14px;font-size:13px;min-height:44px;transition:background var(--speed),color var(--speed),transform var(--speed)}.tab[aria-pressed=true],.diet[aria-pressed=true]{background:var(--brand);color:white;border-color:var(--brand)}.diets{display:flex;gap:8px;align-items:center;padding-top:12px}.diets span{font-size:12px;color:var(--muted);margin-right:3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:20px}.card{background:#fff;border:1px solid #e5e8e4;border-radius:17px;overflow:hidden;transition:transform var(--speed),box-shadow var(--speed)}.card:focus-within{box-shadow:0 0 0 2px #146b5733}.photo{aspect-ratio:5/4;display:grid;place-items:center;font-size:58px;background:radial-gradient(circle at 48% 48%,#fff5e8 0 37%,#d2c2a6 38% 41%,transparent 42%),linear-gradient(140deg,#dbe6d8,#efdac2)}.card-body{padding:11px}.card h2{font-size:15px;line-height:1.25;margin:0 0 6px}.tag{color:var(--brand);font-size:11px;font-weight:700;min-height:14px}.allergen{font-size:12px;color:var(--muted);min-height:32px;margin-top:4px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:6px}.price{font-weight:750}.add{background:var(--brand);color:white;border:0;border-radius:11px;width:44px;height:44px;font-size:22px}.count{font-size:12px;color:var(--muted)}.details{border:0;background:none;text-decoration:underline;text-underline-offset:3px;padding:6px 0;color:var(--brand);font-size:12px}.cart{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(500px,100%);background:#fff;border-top:1px solid var(--line);padding:13px 18px max(13px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;box-shadow:0 -4px 20px #2026220a}.cart strong{font-size:21px}.primary{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:14px 16px;min-height:44px;font-weight:650}.empty{grid-column:1/-1;color:var(--muted)}dialog{border:0;border-radius:20px;padding:0;width:min(440px,calc(100% - 24px));max-height:85dvh;box-shadow:0 18px 80px #0004}dialog::backdrop{background:#2026228c}.modal-content{padding:22px}.modal-content h2{margin:0 0 8px}.modal-content p{line-height:1.5;color:var(--muted)}.modal-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:18px}.secondary{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;min-height:44px}.qty{display:flex;align-items:center;gap:12px}.qty button{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff}.demo-note{margin:0 18px 10px;font-size:11px;color:var(--muted)}@media(max-width:350px){.grid{gap:8px}.card-body{padding:8px}.section{padding:18px 12px}.diets{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style></head><body><main class="app"><header class="top"><div><div class="logo">CartaViva <span>●</span></div><div class="sub">Tu restaurante, a tu ritmo</div></div><div class="icons"><button class="icon" id="toggleSearch" aria-label="Abrir búsqueda" aria-expanded="false" aria-controls="searchBox">⌕</button><button class="icon" aria-label="Ver cesta" id="headerCart">♧</button></div></header><div class="search" id="searchBox" hidden><input id="query" type="search" placeholder="Buscar platos…" aria-label="Buscar platos"></div><div class="hero"><strong>Una carta para disfrutar</strong></div><section class="section"><h1>¿Qué te apetece hoy?</h1><p class="muted">Descubre los platos preparados para ti.</p><nav class="tabs" aria-label="Categorías" id="tabs"></nav><div class="diets" aria-label="Preferencias alimentarias"><span>Filtrar:</span><button class="diet" data-diet="Todos">Todos</button><button class="diet" data-diet="Vegetariano">🌿 Vegetariano</button><button class="diet" data-diet="Vegano">🌱 Vegano</button></div><div class="grid" id="grid" aria-live="polite"></div></section><p class="demo-note">Referencia visual interactiva · platos, precios e ilustraciones provisionales. No es la aplicación final.</p></main><footer class="cart"><div><div class="count" id="count">0 productos seleccionados</div><strong id="total">0,00 €</strong></div><button class="primary" id="viewCart">Ver mi cesta →</button></footer><dialog id="dialog"><div class="modal-content" id="dialogBody"></div></dialog>
<script>
"use strict";
// Fixture exclusivamente visual: no inferir dietas ni alérgenos de fotografías.
const data=[
{id:1,name:"Ensalada mediterránea",category:"Entrantes",cents:450,allergens:"Leche",diet:"Vegetariano",emoji:"🥗",description:"Verduras frescas, queso y aliño mediterráneo."},
{id:2,name:"Pasta cremosa",category:"Primeros",cents:790,allergens:"Gluten · Leche",diet:"Vegetariano",emoji:"🍝",description:"Pasta con salsa cremosa y queso."},
{id:3,name:"Pollo a la brasa",category:"Segundos",cents:950,allergens:"Declaración de alérgenos pendiente",diet:null,emoji:"🍗",description:"Pollo dorado con hierbas y guarnición."},
{id:4,name:"Tarta de queso",category:"Postres",cents:420,allergens:"Gluten · Huevo · Leche",diet:"Vegetariano",emoji:"🍰",description:"Postre cremoso de queso."},
{id:5,name:"Agua mineral",category:"Bebidas",cents:150,allergens:"Declaración de alérgenos pendiente",diet:"Vegano",emoji:"🥤",description:"Agua mineral, 50 cl."},
{id:6,name:"Bowl vegetal",category:"Primeros",cents:720,allergens:"Consultar ficha de alérgenos",diet:"Vegano",emoji:"🥑",description:"Quinoa, legumbres y verduras frescas."},
{id:7,name:"Zumo de naranja",category:"Bebidas",cents:250,allergens:"Declaración de alérgenos pendiente",diet:"Vegano",emoji:"🍊",description:"Zumo de naranja natural."}
];
const categories=["Todos","Entrantes","Primeros","Segundos","Postres","Bebidas"];let selected="Todos",diet="Todos";const qty={};const money=c=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(c/100);const grid=document.querySelector("#grid"),tabs=document.querySelector("#tabs"),dialog=document.querySelector("#dialog"),body=document.querySelector("#dialogBody");
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function button(text,cls,fn){const b=node("button",cls,text);b.type="button";b.onclick=fn;return b}
function matches(p){const q=document.querySelector("#query").value.trim().toLocaleLowerCase("es");return(selected==="Todos"||p.category===selected)&&(diet==="Todos"||(diet==="Vegetariano"&&(p.diet==="Vegetariano"||p.diet==="Vegano"))||(diet==="Vegano"&&p.diet==="Vegano"))&&p.name.toLocaleLowerCase("es").includes(q)}
function render(){tabs.replaceChildren(...categories.map(c=>{const b=button(c,"tab",()=>{selected=c;render()});b.setAttribute("aria-pressed",String(c===selected));return b}));document.querySelectorAll("[data-diet]").forEach(b=>{b.setAttribute("aria-pressed",String(b.dataset.diet===diet))});grid.replaceChildren();const visible=data.filter(matches);for(const p of visible){const card=node("article","card"),photo=node("div","photo",p.emoji),content=node("div","card-body"),tag=node("div","tag",p.diet?("✓ "+p.diet):""),title=node("h2","",p.name),allergens=node("div","allergen",p.allergens),bottom=node("div","bottom"),price=node("span","price",money(p.cents)),add=button("+","add",()=>{qty[p.id]=(qty[p.id]||0)+1;render()});photo.setAttribute("aria-hidden","true");add.setAttribute("aria-label","Añadir "+p.name);bottom.append(price,add);content.append(tag,title,allergens,bottom,button("Ver detalles","details",()=>showProduct(p)),node("div","count",qty[p.id]?qty[p.id]+" en tu cesta":""));card.append(photo,content);grid.append(card)}if(!visible.length)grid.append(node("p","empty","No hay productos que coincidan con los filtros."));const count=data.reduce((s,p)=>s+(qty[p.id]||0),0),total=data.reduce((s,p)=>s+(qty[p.id]||0)*p.cents,0);document.querySelector("#count").textContent=count+" productos seleccionados";document.querySelector("#total").textContent=money(total)}
function showProduct(p){body.replaceChildren(node("h2","",p.name),node("p","",p.description),node("p","",p.diet?"Clasificación dietética de ejemplo: "+p.diet:"Clasificación dietética no verificada"),node("p","", "Alérgenos (datos ficticios): "+p.allergens),node("h2","",money(p.cents)));const actions=node("div","modal-actions");actions.append(button("Cerrar","secondary",()=>dialog.close()),button("Añadir a la selección","primary",()=>{qty[p.id]=(qty[p.id]||0)+1;dialog.close();render()}));body.append(actions);dialog.showModal()}
function showCart(){body.replaceChildren(node("h2","","Tu cesta"));const chosen=data.filter(p=>qty[p.id]);if(!chosen.length)body.append(node("p","","Todavía no has seleccionado productos."));for(const p of chosen){const row=node("div","modal-actions"),label=node("span","",p.name+" · "+money(p.cents)),counter=node("div","qty"),minus=button("−","",()=>{qty[p.id]=Math.max(0,(qty[p.id]||0)-1);showCart();render()}),plus=button("+","",()=>{qty[p.id]=(qty[p.id]||0)+1;showCart();render()});minus.setAttribute("aria-label","Quitar una unidad de "+p.name);plus.setAttribute("aria-label","Añadir una unidad de "+p.name);counter.append(minus,node("strong","",String(qty[p.id])),plus);row.append(label,counter);body.append(row)}const total=data.reduce((s,p)=>s+(qty[p.id]||0)*p.cents,0);body.append(node("h2","", "Total: "+money(total)),node("p","","Prototipo visual: no se realiza ninguna reserva ni pedido."));const actions=node("div","modal-actions");actions.append(button("Cerrar","secondary",()=>dialog.close()));body.append(actions);if(!dialog.open)dialog.showModal()}
document.querySelectorAll("[data-diet]").forEach(b=>b.onclick=()=>{diet=b.dataset.diet;render()});document.querySelector("#toggleSearch").onclick=()=>{const s=document.querySelector("#searchBox"),open=s.hidden;s.hidden=!open;document.querySelector("#toggleSearch").setAttribute("aria-expanded",String(open));document.querySelector("#toggleSearch").setAttribute("aria-label",open?"Cerrar búsqueda":"Abrir búsqueda");if(open)document.querySelector("#query").focus();else{document.querySelector("#query").value="";render()}};document.querySelector("#query").oninput=render;document.querySelector("#query").onkeydown=e=>{if(e.key==="Escape"&&!document.querySelector("#searchBox").hidden)document.querySelector("#toggleSearch").click()};document.querySelector("#viewCart").onclick=showCart;document.querySelector("#headerCart").onclick=showCart;render();
</script></body></html>
